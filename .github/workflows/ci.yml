name: Portal checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile source
        run: python -m py_compile app.py generate_documents.py
      - name: Run portal integration tests
        run: python -m unittest discover -s tests -v
      - name: Build production container
        run: docker build -t ploda-portal:test .
